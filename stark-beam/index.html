<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="STARK BEAM" />
  <meta name="theme-color" content="#050a0f" />
  <title>STARK BEAM // Escáner Móvil</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./css/stark.css" />
  <style>
    body {
      overflow: hidden;
      background: #000;
      touch-action: none;
    }
    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #04090e;
    }
    #cameraVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #hudCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 6;
    }

    /* AR Projection Layer */
    #arStage {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      display: none;
    }
    #arStage.active { display: block; }
    #arPlane {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 360px;
      transform-origin: 0 0;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 28px rgba(0, 229, 255, 0.4);
    }
    #arImg, #arVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    #arAudioOverlay {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #0b2638 0%, #030a12 80%);
      color: var(--cyan);
      font-family: var(--font-mono);
      text-align: center;
      padding: 24px;
    }
    .ar-handle {
      position: absolute;
      width: 34px;
      height: 34px;
      margin: -17px 0 0 -17px;
      border-radius: 50%;
      border: 2.5px solid var(--amber);
      background: rgba(255, 179, 0, 0.28);
      box-shadow: 0 0 14px rgba(255, 179, 0, 0.8);
      pointer-events: auto;
      touch-action: none;
      z-index: 14;
      display: none;
    }
    .ar-handle.visible { display: block; }

    /* Top HUD */
    .top-bar {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
    }
    .mode-switch {
      display: inline-flex;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-hud);
      border-radius: 9px;
      padding: 3px;
      gap: 3px;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--cyan);
      color: #031018;
    }

    /* P2P Pairing Bar */
    #p2pBar {
      position: fixed;
      top: calc(max(10px, env(safe-area-inset-top)) + 58px);
      left: 10px;
      right: 10px;
      z-index: 19;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      max-width: 540px;
      margin: 0 auto;
    }
    #p2pBar.show { display: flex; }
    #codeInput {
      width: 96px;
      background: rgba(0, 229, 255, 0.09);
      border: 1px solid var(--border-hud);
      border-radius: 8px;
      padding: 7px 9px;
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      outline: none;
    }

    /* Bottom Dock */
    .bottom-dock {
      position: fixed;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 10px;
      right: 10px;
      z-index: 20;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      max-width: 540px;
      margin: 0 auto;
    }

    #flickZone {
      border: 1px dashed rgba(0, 229, 255, 0.45);
      border-radius: 11px;
      padding: 11px 12px;
      background: linear-gradient(180deg, rgba(0, 229, 255, 0.13), rgba(0, 229, 255, 0.03));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      touch-action: none;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }
    #flickZone.ready {
      border-style: solid;
      border-color: var(--amber);
      background: linear-gradient(180deg, rgba(255, 179, 0, 0.18), rgba(0, 229, 255, 0.05));
    }
    .file-meta { min-width: 0; flex: 1; }
    .file-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-hint {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .dock-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .progress-wrap {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      overflow: hidden;
      display: none;
    }
    .progress-wrap.show { display: block; }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--amber));
      transition: width 0.12s linear;
    }

    #remoteBar {
      display: none;
      padding-top: 8px;
      border-top: 1px solid rgba(0, 229, 255, 0.18);
      flex-direction: column;
      gap: 7px;
    }
    #remoteBar.show { display: flex; }
    .range-slider { flex: 1; accent-color: var(--cyan); }

    #cameraFallback {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
      z-index: 4;
      background: radial-gradient(circle at center, #091d2c 0%, #03080d 75%);
      gap: 12px;
    }
    #cameraFallback.show { display: flex; }

    #toast {
      position: fixed;
      top: calc(max(10px, env(safe-area-inset-top)) + 118px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      padding: 8px 14px;
      border-radius: 9px;
      background: rgba(4, 14, 22, 0.94);
      border: 1px solid var(--amber);
      color: var(--amber);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-align: center;
      max-width: 90vw;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="viewport">
    <video id="cameraVideo" autoplay playsinline muted></video>

    <div id="cameraFallback">
      <div class="hud-mono" style="color:var(--amber);font-size:14px;letter-spacing:0.12em">CÁMARA INACTIVA</div>
      <p style="color:var(--text-muted);font-size:13px;max-width:320px;line-height:1.5">
        Toca el botón para activar la cámara trasera de tu celular. También puedes transmitir en modo TV P2P sin cámara.
      </p>
      <button id="retryCamBtn" class="btn btn-primary btn-sm" type="button">ACTIVAR CÁMARA</button>
    </div>

    <div id="arStage">
      <div id="arPlane">
        <img id="arImg" alt="AR Media" />
        <video id="arVideo" playsinline loop x-webkit-airplay="allow"></video>
        <div id="arAudioOverlay">
          <div style="font-size:20px;letter-spacing:0.15em">ARC AUDIO OVERRIDE</div>
          <div id="arAudioName" style="margin-top:8px;font-size:13px;color:var(--amber)"></div>
        </div>
      </div>
      <div class="ar-handle" data-idx="0"></div>
      <div class="ar-handle" data-idx="1"></div>
      <div class="ar-handle" data-idx="2"></div>
      <div class="ar-handle" data-idx="3"></div>
    </div>

    <canvas id="hudCanvas"></canvas>
  </div>

  <!-- Top HUD -->
  <header class="top-bar glass-panel">
    <div class="hud-mono" style="display:flex;align-items:center;gap:7px;font-size:12px">
      <span id="connDot" class="status-dot locked"></span>
      <span style="letter-spacing:0.1em;color:var(--cyan);font-weight:800">STARK</span>
    </div>

    <div class="mode-switch">
      <button id="modeArBtn" class="mode-btn active" type="button">AR HIJACK</button>
      <button id="modeP2pBtn" class="mode-btn" type="button">TV P2P</button>
    </div>

    <button id="flipCamBtn" class="btn btn-sm" type="button" title="Cambiar cámara">↺</button>
  </header>

  <!-- P2P Pairing Strip (only in TV P2P mode) -->
  <div id="p2pBar" class="glass-panel">
    <input id="codeInput" type="text" maxlength="6" placeholder="CÓDIGO" autocomplete="off" />
    <button id="connectCodeBtn" class="btn btn-primary btn-sm" type="button">ENLAZAR</button>
    <button id="shareTvBtn" class="btn btn-amber btn-sm" style="margin-left:auto" type="button">LINK TV</button>
  </div>

  <div id="toast"></div>

  <!-- Bottom Stark Control Dock -->
  <section class="bottom-dock glass-panel">
    <div id="flickZone">
      <div class="file-meta">
        <div id="fileName" class="file-name hud-mono">CARGA JPEG, MP3, MP4 O MOV</div>
        <div id="fileHint" class="file-hint hud-mono">Elige un archivo de tu cel • Desliza ↑ para lanzar</div>
      </div>
      <label class="btn btn-sm" style="cursor:pointer">
        ARCHIVO
        <input id="fileInput" type="file" accept=".jpg,.jpeg,.png,.webp,.mp3,.wav,.m4a,.mp4,.mov,.webm,image/*,audio/*,video/*" hidden />
      </label>
    </div>

    <div id="progressWrap" class="progress-wrap">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div class="dock-row">
      <button id="beamBtn" class="btn btn-primary" style="flex:1" type="button">
        ▲ OVERRIDE / PROYECTAR
      </button>
      <button id="arPinBtn" class="btn btn-amber btn-sm" type="button">
        ESQUINAS
      </button>
      <button id="restoreBtn" class="btn btn-danger btn-sm" type="button">
        LIBERAR
      </button>
    </div>

    <!-- Remote playback controls (TV P2P mode) -->
    <div id="remoteBar">
      <div class="dock-row">
        <button id="playBtn" class="btn btn-sm" type="button">▶</button>
        <button id="pauseBtn" class="btn btn-sm" type="button">❚❚</button>
        <input id="seekSlider" class="range-slider" type="range" min="0" max="100" value="0" />
        <span id="timeReadout" class="hud-mono" style="font-size:11px;color:var(--text-muted)">00:00</span>
      </div>
      <div class="dock-row">
        <span class="hud-mono" style="font-size:10px;color:var(--text-muted)">VOL</span>
        <input id="volSlider" class="range-slider" type="range" min="0" max="1" step="0.05" value="1" />
        <button id="muteBtn" class="btn btn-sm" type="button">MUTE</button>
      </div>
    </div>
  </section>

  <audio id="arAudioEl" playsinline></audio>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="./js/audio-fx.js"></script>
  <script src="./js/vision.js"></script>
  <script src="./js/p2p.js"></script>
  <script src="./js/scanner.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
