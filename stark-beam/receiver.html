<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>STARK BEAM // Pantalla Receptora TV</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="stylesheet" href="./css/stark.css" />
  <style>
    body {
      overflow: hidden;
      background: #02060a;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #081826 0%, #02060a 75%);
    }
    .corner {
      position: fixed;
      width: 56px;
      height: 56px;
      pointer-events: none;
      z-index: 20;
    }
    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: var(--cyan);
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.7);
    }
    .corner.tl { top: 20px; left: 20px; }
    .corner.tl::before { top: 0; left: 0; width: 40px; height: 4px; }
    .corner.tl::after  { top: 0; left: 0; width: 4px; height: 40px; }
    .corner.tr { top: 20px; right: 20px; }
    .corner.tr::before { top: 0; right: 0; width: 40px; height: 4px; }
    .corner.tr::after  { top: 0; right: 0; width: 4px; height: 40px; }
    .corner.bl { bottom: 20px; left: 20px; }
    .corner.bl::before { bottom: 0; left: 0; width: 40px; height: 4px; }
    .corner.bl::after  { bottom: 0; left: 0; width: 4px; height: 40px; }
    .corner.br { bottom: 20px; right: 20px; }
    .corner.br::before { bottom: 0; right: 0; width: 40px; height: 4px; }
    .corner.br::after  { bottom: 0; right: 0; width: 4px; height: 40px; }

    #standbyView {
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      padding: 24px;
    }
    #qrBox {
      background: #ffffff;
      padding: 12px;
      border-radius: 14px;
      box-shadow: 0 0 36px rgba(0, 229, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 170px;
      min-height: 170px;
    }
    #qrBox img, #qrBox canvas {
      display: block;
      width: 164px;
      height: 164px;
      image-rendering: pixelated;
    }
    .code-badge {
      font-size: clamp(36px, 6.5vw, 68px);
      font-weight: 800;
      letter-spacing: 0.24em;
      color: var(--cyan);
      text-shadow: 0 0 26px rgba(0, 229, 255, 0.5);
    }

    #transferOverlay {
      position: fixed;
      inset: 0;
      z-index: 28;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(2, 10, 18, 0.88);
      gap: 14px;
    }
    #transferOverlay.show { display: flex; }
    .transfer-bar-bg {
      width: min(76vw, 420px);
      height: 8px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 99px;
      overflow: hidden;
    }
    #transferBarFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--amber));
      transition: width 0.1s linear;
    }

    #mediaLayer {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 10;
    }
    #mediaLayer.active { display: flex; }
    #imgPlayer, #videoPlayer {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #000;
    }
    #audioStage {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #081e2d 0%, #02070c 72%);
    }
    #audioCanvas {
      width: min(72vw, 400px);
      height: min(72vw, 400px);
    }

    #overrideBanner {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(2, 10, 18, 0.92);
      pointer-events: none;
      text-align: center;
      padding: 24px;
    }
    #overrideBanner.show { display: flex; }
    .override-box {
      border: 2px solid var(--amber);
      padding: 24px 40px;
      background: rgba(255, 179, 0, 0.08);
      box-shadow: 0 0 50px rgba(255, 179, 0, 0.25);
    }
    .override-title {
      font-size: clamp(24px, 5vw, 52px);
      letter-spacing: 0.16em;
      color: var(--amber);
      font-weight: 800;
    }
    .override-sub {
      margin-top: 10px;
      font-size: 14px;
      letter-spacing: 0.18em;
      color: var(--cyan);
    }
    #liveHudTag {
      position: fixed;
      top: 18px;
      left: 24px;
      z-index: 25;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      border-radius: 7px;
      background: rgba(4, 12, 20, 0.72);
      border: 1px solid rgba(0, 229, 255, 0.35);
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--cyan);
    }
    #liveHudTag.show { display: flex; }
  </style>
</head>
<body>
  <div id="stage">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div id="standbyView">
      <div class="hud-mono" style="font-size:12px;letter-spacing:0.22em;color:var(--text-muted)">
        STARK BEAM // APUNTA TU CELULAR PARA HACKEAR ESTA PANTALLA
      </div>
      <div id="qrBox" aria-label="Código QR de enlace"></div>
      <div id="screenCode" class="code-badge hud-mono">----</div>
      <div id="connStatus" class="hud-mono" style="font-size:12px;color:var(--text-muted)">
        <span class="status-dot"></span> INICIALIZANDO SEÑAL P2P...
      </div>
      <button id="unlockBtn" class="btn btn-amber" type="button">
        ACTIVAR AUDIO Y PANTALLA COMPLETA
      </button>
    </div>

    <div id="transferOverlay">
      <div class="hud-mono" style="font-size:14px;letter-spacing:0.18em;color:var(--cyan)">
        INTERCEPTANDO SEÑAL ENTRANTE...
      </div>
      <div class="transfer-bar-bg">
        <div id="transferBarFill"></div>
      </div>
      <div id="transferPct" class="hud-mono" style="font-size:13px;color:var(--amber)">0%</div>
    </div>

    <div id="mediaLayer">
      <img id="imgPlayer" alt="Señal proyectada" />
      <video id="videoPlayer" playsinline x-webkit-airplay="allow"></video>
      <div id="audioStage">
        <canvas id="audioCanvas" width="400" height="400"></canvas>
        <div id="audioTitle" class="hud-mono" style="font-size:clamp(16px,3vw,26px);letter-spacing:0.12em;color:var(--cyan)">AUDIO</div>
        <div id="audioTime" class="hud-mono" style="font-size:13px;color:var(--text-muted)">00:00 / 00:00</div>
        <audio id="audioPlayer" x-webkit-airplay="allow"></audio>
      </div>
    </div>

    <div id="liveHudTag" class="hud-mono">
      <span class="status-dot hijacked"></span>
      <span id="liveFileLabel">SIGNAL OVERRIDE</span>
    </div>

    <div id="overrideBanner">
      <div class="override-box">
        <div class="override-title hud-mono">SIGNAL OVERRIDE</div>
        <div id="overrideSub" class="override-sub hud-mono">STARK INDUSTRIES // ENLAZANDO SEÑAL...</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="./js/audio-fx.js"></script>
  <script src="./js/p2p.js"></script>
  <script src="./js/receiver.js"></script>
</body>
</html>
