<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SR Apps</title>
  <meta name="theme-color" content="#040608" />
  <style>
    :root {
      --bg: #040608;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
      padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
    }
    .wrap {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    header {
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.04em; }
    .tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.12em;
    }
    p { font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>SR APPS</h1>
      <span class="tag">MOBILE SUITE</span>
    </header>
    <p>Repositorio listo para tus próximas aplicaciones.</p>
  </main>
</body>
</html>
